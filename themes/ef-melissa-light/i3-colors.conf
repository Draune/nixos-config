# Backgrounds
set $bg_main        #fff6d8
set $bg_dim         #f5e9cb
set $bg_alt         #e7d7c6
set $bg_active      #c7b7a6
set $bg_inactive    #f9efd4

# Foregrounds
set $fg_main        #484431
set $fg_dim         #68708a
set $fg_alt         #80431a

# Borders
set $border_color   #c5baa6

# Accents
set $red            #ba2d2f
set $green          #007a0a
set $yellow         #a26310
set $blue           #375cc6
set $magenta        #aa3e74
set $cyan           #3f60af

# class                 border        background     text        indicator      child_border
client.focused          $border_color $bg_active     $fg_main    $blue          $border_color
client.focused_inactive $border_color $bg_inactive   $fg_dim     $bg_alt        $border_color
client.unfocused        $border_color $bg_dim        $fg_dim     $bg_dim        $border_color
client.urgent           $red          $bg-red-subtle $fg_main    $red           $red
client.placeholder      $border_color $bg_dim        $fg_dim     $bg_dim        $border_color

# Start i3bar to display a workspace bar (plus the system information i3status
# finds out, if available)
bar {
        status_command i3status
	colors {
	        background         $bg_main
        	statusline         $fg_main
	        separator          $border_color

		focused_workspace  $bg_active    $bg_active    $fg_main
		active_workspace   $bg_alt       $bg_alt       $fg_main
		inactive_workspace $bg_inactive  $bg_inactive  $fg_dim
		urgent_workspace   $red          $red          $bg_main
		binding_mode       $magenta      $magenta      $bg_main
	}		
}
